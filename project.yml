name: RedFluentVPN
options:
  bundleIdPrefix: com.redfluent
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: FWFT4Z5ASR
    CODE_SIGN_STYLE: Manual
targets:
  RedFluentVPN:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redfluent.vpn
        INFOPLIST_FILE: Supporting/RedFluentVPN-Info.plist
        CODE_SIGN_ENTITLEMENTS: Entitlements/RedFluentVPN.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "RedFluent VPN App Store"
    dependencies:
      - target: RedFluentVPNTunnel
  RedFluentVPNTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel
      - path: Tunnel/Resources
        optional: true
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redfluent.vpn.tunnel
        INFOPLIST_FILE: Supporting/RedFluentVPNTunnel-Info.plist
        CODE_SIGN_ENTITLEMENTS: Entitlements/RedFluentVPNTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        PRODUCT_NAME: RedFluentVPNTunnel
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "RedFluent VPN Tunnel App Store"
        OTHER_SWIFT_FLAGS: "-DHAS_LIBBOX"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/Frameworks"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: "-framework SystemConfiguration -framework CoreTelephony -lresolv -lc++"
    dependencies:
      - framework: Frameworks/Libbox.xcframework
        embed: true
        codeSign: true
